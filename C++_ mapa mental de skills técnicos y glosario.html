<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++: skills map and glossary / mapa de skills y glosario</title>
<style>
:root{
  --bg:#0f1419;--panel:#171e26;--panel2:#1d2630;--line:#2a3643;--tx:#e6edf3;--mut:#8b9bab;--acc:#f9d65a;--c1:#4f9cf9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 8px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:var(--mut);font-size:14px}
nav{max-width:1400px;margin:12px auto 0;padding:0 24px;display:flex;gap:8px;align-items:center}
nav button,.lang button{background:var(--panel);color:var(--mut);border:1px solid var(--line);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{color:var(--tx);border-color:var(--c1);background:var(--panel2)}
.lang{margin-left:auto;display:flex}
.lang button{padding:6px 12px;border-radius:0;font-size:13px}
.lang button:first-child{border-radius:8px 0 0 8px}
.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button.on{background:var(--acc);color:#0f1419;border-color:var(--acc);font-weight:700}
main{max-width:1400px;margin:0 auto;padding:12px 24px 40px}
.view{display:none}.view.on{display:block}
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:1000px){.map-wrap{grid-template-columns:1fr}}
.map{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;overflow:hidden}
svg{width:100%;height:auto;display:block}
.link{stroke:var(--line);stroke-width:1.5;fill:none}
.leaf{cursor:pointer}
.leaf circle{stroke-width:2;transition:r .15s}
.leaf:hover circle,.leaf.sel circle{r:11}
.leaf text{fill:var(--tx);font-size:12.5px}
.leaf.sel text{fill:var(--acc);font-weight:600}
.cat{cursor:pointer}
.cat text{fill:#0f1419;font-weight:700;font-size:13px;text-anchor:middle}
.cat.dim,.leaf.dim,.link.dim{opacity:.18}
.center circle{fill:var(--panel2);stroke:var(--acc);stroke-width:2.5}
.center text{fill:var(--acc);font-weight:800;font-size:22px;text-anchor:middle}
.center .sub{fill:var(--mut);font-size:11px;font-weight:400}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.side h2{font-size:18px;margin:0 0 4px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;color:#0f1419;font-weight:600;margin-bottom:10px}
.side h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.side ul{margin:0;padding-left:18px}
.side li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--k,var(--line));border-left-width:4px;color:var(--tx);padding:3px 10px;border-radius:8px;font-size:12.5px;cursor:pointer}
.chip:hover{color:var(--k,var(--acc))}
.chip.done{opacity:.45;text-decoration:line-through}
.hint{color:var(--mut);font-size:14px}
.david{margin-top:14px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--panel2);border-radius:0 8px 8px 0;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font-size:12.5px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--k)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
input[type=search]{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:10px 14px;border-radius:8px;font:inherit}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.row .lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.row button{background:var(--panel);border:1px solid var(--k,var(--line));color:var(--mut);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.row button.on{color:#0f1419;background:var(--k,var(--acc));border-color:var(--k,var(--acc));font-weight:600}
.row button.cat-btn{color:var(--k)}
.row button.cat-btn.on{color:#0f1419}
.stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:4px 0 12px}
.prog{flex:0 0 180px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:#52c48a}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.term{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:10px;padding:10px 14px 12px;position:relative}
.term.isprio{background:linear-gradient(90deg,rgba(249,214,90,.09),var(--panel) 60%);border-color:rgba(249,214,90,.35);border-left-color:var(--k)}
.term.isdone{opacity:.5}
.term.flash{box-shadow:0 0 0 2px rgba(249,214,90,.5)}
.term .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.term b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--k);word-break:break-word}
.term small{display:block;color:var(--k);opacity:.85;font-size:11.5px;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.term p{margin:4px 0 0;font-size:14px}
.acts{display:flex;gap:4px;flex:none;-webkit-user-select:none;user-select:none}
.acts button{-webkit-user-select:none;user-select:none}
.term b,.term p,.term small{-webkit-user-select:text;user-select:text;cursor:text}
.acts button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);width:auto;height:28px;padding:0 9px;border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.acts button:hover{color:var(--tx);border-color:var(--mut)}
.acts .star.on{color:#0f1419;background:var(--acc);border-color:var(--acc);font-weight:700}
.acts .ok.on{color:#0f1419;background:#52c48a;border-color:#52c48a;font-weight:700}
.empty{color:var(--mut);padding:24px;text-align:center;grid-column:1/-1}
.note{color:var(--mut);font-size:12px;margin-top:18px}

.qwrap{max-width:820px;margin:8px auto 0}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.qhead{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px;margin-bottom:10px}
.qhead b{color:var(--tx)}
.qprog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;background:var(--c1);transition:width .25s}
.qdef{font-size:19px;line-height:1.5;margin:6px 0 20px}
.qcat{display:inline-block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--k);border:1px solid var(--k);padding:2px 10px;border-radius:99px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.qopts{grid-template-columns:1fr}}
.qopt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--k);color:var(--tx);padding:12px 14px;border-radius:10px;cursor:pointer;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.qopt:hover:not(:disabled){border-color:var(--k);background:#222d3a}
.qopt .n{color:var(--mut);font-size:12px;min-width:14px}
.qopt:disabled{cursor:default}
.qopt.right{background:rgba(82,196,138,.18);border-color:#52c48a;border-left-color:#52c48a}
.qopt.wrong{background:rgba(239,107,107,.18);border-color:#ef6b6b;border-left-color:#ef6b6b}
.qopt.faded{opacity:.45}
.qfb{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--panel2);font-size:14px}
.qfb.ok{border-left:4px solid #52c48a}.qfb.bad{border-left:4px solid #ef6b6b}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--c1);border-color:var(--c1);color:#0f1419;font-weight:700}
.btn.on{background:var(--acc);border-color:var(--acc);color:#0f1419;font-weight:700}
.qscore{font-size:44px;font-weight:800;margin:4px 0}
.qmiss{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.qmiss li{background:var(--panel2);border-left:4px solid var(--k);border-radius:8px;padding:8px 12px;font-size:14px}
.qmiss b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--k)}
.qkeys{color:var(--mut);font-size:12px;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1 id="t-h1"></h1>
  <p id="t-sub"></p>
</header>
<nav>
  <button id="b-map" class="on"></button>
  <button id="b-gl"></button>
  <button id="b-quiz"></button>
  <div class="lang" role="group" aria-label="Language / Idioma">
    <button id="l-es">ES</button><button id="l-en">EN</button>
  </div>
</nav>
<main>
  <section id="v-map" class="view on">
    <div class="map-wrap">
      <div class="map">
        <svg id="svg" viewBox="0 0 1300 1000" role="img"></svg>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="side" id="side"></aside>
    </div>
  </section>
  <section id="v-gl" class="view">
    <div class="tools">
      <input type="search" id="q">
    </div>
    <div class="row" id="status"></div>
    <div class="row" id="filters"></div>
    <div class="stats"><span id="count"></span><div class="prog"><i id="prog"></i></div><span id="pct"></span></div>
    <div class="gl" id="gl"></div>
    <p class="note" id="note"></p>
  </section>
  <section id="v-quiz" class="view">
    <div class="qwrap" id="quiz"></div>
  </section>
</main>

<script>

 23:{name:'High-performance optimization',sum:'Advanced techniques to squeeze the hardware: profiling, data layout, caches, SIMD and well-sized multithreading. Expected in video games and scientific computing.',study:['Cache locality and data-oriented design','SIMD / vectorization','Avoid allocations in the hot path','Benchmarking with Google Benchmark']},
 21:{name:'Real-time systems',sum:'Programming where timing matters more than average speed: operating systems, game engines, embedded. It requires RTOS notions and designing to meet strict deadlines.',study:['RTOS concepts','Latency, jitter and deadlines','Avoid dynamic allocation and blocking','Embedded programming']},
 8:{name:'Cross-platform development',sum:'Make the same code work on Windows, Linux and macOS, handling differences in compilers, system APIs and architectures.',study:['CMake and toolchains','GCC / Clang / MSVC differences','Endianness and type sizes','Platform abstractions']},
 9:{name:'Compiler and linker',sum:'Understand how code becomes an executable: preprocessing, compiling, linking. It helps optimize build times, fix link errors and manage dependencies in large projects.',study:['Stages: preprocessor, compiler, assembler, linker','Headers vs sources and ODR','Static vs dynamic linking','Flags: -O2, -Wall, -fsanitize']},
 10:{name:'Version control',sum:'Git to integrate the work of several people, revert mistakes and understand how the project evolved.',study:['Branches, merge and rebase','Pull requests and code review','Submodules and dependency management']},
 15:{name:'Continuous integration (CI)',sum:'Pipelines that build and test every change automatically to catch bugs early and speed up delivery.',study:['GitHub Actions, GitLab CI, Jenkins','Build caching (ccache)','Compiler and OS matrix','Static analysis in CI'],david:'You already use Jenkins and GitHub Pages: it is the same idea here, but with much slower builds.'},
 19:{name:'Unit testing and QA',sum:'Automated testing frameworks to catch failures early and raise software reliability.',study:['GoogleTest / Catch2','Mocks and fakes','Coverage','Fuzzing']},
 18:{name:'Technical writing',sum:'Document code and processes so the project stays maintainable by other people.',study:['Doxygen','README and ADRs','Comments that explain the why']},
 20:{name:'Secure coding practices',sum:'Know the classic security pitfalls of C++ and apply good practices consistently to avoid them.',study:['Buffer overflows and bounds checking','Integer overflow','CERT C++ and Core Guidelines','Tools: sanitizers and static analysis']},

const NS='http://www.w3.org/2000/svg';
const svg=$('#svg');
const W=1300,H=1000,CX=W/2,CY=H/2;
const R1=175,R2=395;
let selN=null;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in (a||{}))e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}

function buildMap(){
  svg.innerHTML='';svg.dataset.hl='';
  svg.setAttribute('aria-label',L().h1);
  const total=SKILLS.length,step=360/total;

  const gLinks=el('g'),gNodes=el('g');
  CATS.forEach(cat=>{
    const items=SKILLS.filter(s=>s.c===cat.id);
    const start=angle;
    const pts=items.map((s,i)=>({s:skillOf(s),a:(start+step*(i+.5))*Math.PI/180}));
    angle+=step*items.length;
    const mid=(start+step*items.length/2)*Math.PI/180;
    const cx=CX+Math.cos(mid)*R1,cy=CY+Math.sin(mid)*R1;
    el('path',{d:`M${CX},${CY} L${cx},${cy}`,class:'link','data-c':cat.id,stroke:cat.color,'stroke-width':3,opacity:.7},gLinks);
    pts.forEach(({s,a})=>{
      const x=CX+Math.cos(a)*R2,y=CY+Math.sin(a)*R2;
      const mx=CX+Math.cos(a)*(R1+110),my=CY+Math.sin(a)*(R1+110);
      el('path',{d:`M${cx},${cy} Q${mx},${my} ${x},${y}`,class:'link','data-c':cat.id,stroke:cat.color,'stroke-opacity':.5},gLinks);
      const g=el('g',{class:'leaf'+(s.n===selN?' sel':''),'data-n':s.n,'data-c':cat.id,tabindex:0,role:'button','aria-label':s.name},gNodes);
      el('circle',{cx:x,cy:y,r:8,fill:cat.color,stroke:'#0f1419'},g);
      const cosA=Math.cos(a),side=Math.abs(cosA)<.25;
      const anchor=side?'middle':(cosA>0?'start':'end');
      const dx=side?0:(cosA>0?16:-16);
      const dy=side?(Math.sin(a)>0?26:-16):4;
      const t=el('text',{x:x+dx,y:y+dy,'text-anchor':anchor},g);
      wrapLabel(t,`${s.n}. ${s.name}`,x+dx);
      g.addEventListener('click',()=>selectSkill(s.n));
      g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectSkill(s.n)}});
    });
    const cg=el('g',{class:'cat','data-c':cat.id},gNodes);
    el('circle',{cx,cy,r:54,fill:cat.color},cg);
    const t=el('text',{x:cx,y:cy-4},cg);
    CAT_LINES[ST.lang][cat.id].forEach((l,i)=>{
      const s=document.createElementNS(NS,'tspan');s.setAttribute('x',cx);s.setAttribute('dy',i?'15':'0');s.textContent=l;t.appendChild(s);
    });
    cg.addEventListener('click',()=>highlightCat(cat.id));
  });
  const c=el('g',{class:'center'},gNodes);
  el('circle',{cx:CX,cy:CY,r:70},c);
  el('text',{x:CX,y:CY+2},c).textContent='C++';
  el('text',{x:CX,y:CY+22,class:'sub'},c).textContent=L().centerSub;
  $('#legend').innerHTML=CATS.map(c=>`<span style="--k:${c.color}">${esc(catName(c.id))}</span>`).join('');
}
function wrapLabel(t,text,x){
  const words=text.split(' ');let l1='',l2='';
  words.forEach(w=>{if((l1+' '+w).trim().length<=24&&!l2)l1=(l1+' '+w).trim();else l2=(l2+' '+w).trim()});
  const a=document.createElementNS(NS,'tspan');a.setAttribute('x',x);a.textContent=l1;t.appendChild(a);
  if(l2){const b=document.createElementNS(NS,'tspan');b.setAttribute('x',x);b.setAttribute('dy','15');b.textContent=l2;t.appendChild(b)}
}
function highlightCat(id){
  const on=svg.dataset.hl===id;
  svg.dataset.hl=on?'':id;
  svg.querySelectorAll('[data-c]').forEach(n=>n.classList.toggle('dim',!on&&n.dataset.c!==id));
}
function renderSide(){
  if(selN==null){
    $('#side').innerHTML=`<h2>${esc(L().detail)}</h2><p class="hint">${esc(L().hint)}</p>`;return;
  }
  const s=skillOf(SKILLS.find(x=>x.n===selN)),cat=catById[s.c];
  svg.querySelectorAll('.leaf').forEach(l=>l.classList.toggle('sel',+l.dataset.n===selN));
  const chips=(s.terms||[]).filter(t=>gIndex[t]).map(t=>{
    const g=gIndex[t];
    const cls=doneSet.has(t)?' done':'';
    const mark=prioSet.has(t)?'★ ':(doneSet.has(t)?'✓ ':'');
    return `<button class="chip${cls}" style="--k:${gcColor(g.c)}" data-t="${esc(t)}">${mark}${esc(t)}</button>`;
  }).join('');
  $('#side').innerHTML=`
    <span class="badge" style="background:${cat.color}">${esc(catName(s.c))}</span>
    <h2>${s.n}. ${esc(s.name)}</h2>
    <p>${esc(s.sum)}</p>
    <h4>${esc(L().study)}</h4>
    <ul>${s.study.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h4>${esc(L().terms)}</h4>
    <div class="chips">${chips}</div>
    ${s.david?`<div class="david"><b>${esc(L().forYou)}</b> ${esc(s.david)}</div>`:''}`;
  $('#side').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>gotoTerm(c.dataset.t)));
}
function selectSkill(n){selN=n;renderSide()}

/* ---------- Glossary ---------- */
const GCATS=[...new Set(GLOSS.map(g=>g.c))];
let gCat='all',gStatus='pending';
function renderFilters(){
  const stOpts=[['pending',L().stPending],['prio','★ '+L().stPrio],['done','✓ '+L().stDone],['all',L().stAll]];
  $('#status').innerHTML=`<span class="lbl">${esc(L().st)}</span>`+stOpts.map(([k,n])=>`<button class="${k===gStatus?'on':''}" data-k="${k}">${esc(n)}</button>`).join('');
  $('#status').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{gStatus=b.dataset.k;renderFilters();renderGloss()}));
  $('#filters').innerHTML=`<span class="lbl">${esc(L().cat)}</span><button class="${gCat==='all'?'on':''}" data-k="all">${esc(L().allF)}</button>`+
    GCATS.map(c=>`<button class="cat-btn ${gCat===c?'on':''}" style="--k:${gcColor(c)}" data-k="${esc(c)}">${esc(gcName(c))}</button>`).join('');
  $('#filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{gCat=b.dataset.k;renderFilters();renderGloss()}));
}
function renderGloss(flash){
  const q=$('#q').value.trim().toLowerCase();
  const list=GLOSS.filter(g=>{
    if(gStatus==='pending'&&doneSet.has(g.t))return false;
    if(gStatus==='prio'&&!prioSet.has(g.t))return false;
    if(gStatus==='done'&&!doneSet.has(g.t))return false;
    if(gCat!=='all'&&g.c!==gCat)return false;
    if(q&&!(g.t.toLowerCase().includes(q)||defOf(g).toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>(prioSet.has(b.t)-prioSet.has(a.t))||a.t.localeCompare(b.t,'en',{sensitivity:'base'}));
  const n=GLOSS.length,d=doneSet.size,p=prioSet.size;
  $('#count').textContent=`${list.length} ${L().of} ${n} ${L().terms_n} · ★ ${p} ${L().prio} · ✓ ${d} ${L().done}`;
  $('#prog').style.width=(d/n*100)+'%';
  $('#pct').textContent=Math.round(d/n*100)+'%';
  $('#gl').innerHTML=list.length?list.map(g=>{
    const isP=prioSet.has(g.t),isD=doneSet.has(g.t);
    return `<div class="term${isP?' isprio':''}${isD?' isdone':''}${flash===g.t?' flash':''}" style="--k:${gcColor(g.c)}" data-t="${esc(g.t)}">
      <div class="top"><div><small>${esc(gcName(g.c))}</small><b>${esc(g.t)}</b></div>
        <div class="acts">
          <button class="star${isP?' on':''}" data-act="prio" data-t="${esc(g.t)}" title="${esc(isP?L().tPrioOn:L().tPrio)}" aria-pressed="${isP}">★ ${esc(isP?L().btnPrioOn:L().btnPrio)}</button>
          <button class="ok${isD?' on':''}" data-act="done" data-t="${esc(g.t)}" title="${esc(isD?L().tDoneOn:L().tDone)}" aria-pressed="${isD}">✓ ${esc(isD?L().btnDoneOn:L().btnDone)}</button>
        </div></div>
      <p>${esc(defOf(g))}</p></div>`;
  }).join(''):`<div class="empty">${esc(L().empty)}</div>`;
  if(flash){const e=$('#gl .flash');if(e)e.scrollIntoView({block:'center'})}
}
$('#gl').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const t=b.dataset.t;
  if(b.dataset.act==='prio'){
    if(prioSet.has(t))prioSet.delete(t);else{prioSet.add(t);doneSet.delete(t)}
  }else{
    if(doneSet.has(t))doneSet.delete(t);else{doneSet.add(t);prioSet.delete(t)}
  }
  persist();renderGloss();renderSide();
});
function gotoTerm(t){
  show('gl');gStatus='all';gCat='all';$('#q').value='';renderFilters();renderGloss(t);
}
$('#q').addEventListener('input',()=>renderGloss());


/* ---------- Quiz ---------- */
const Q={pool:'pending',cat:'all',len:10,s:null,last:null};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function maskDef(g){
  let d=defOf(g);
  [g.t,...g.t.split(' / ').filter(p=>p.length>=3)].forEach(p=>{
    const re=new RegExp('(?<![A-Za-z0-9_+])'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z0-9_])','gi');
    d=d.replace(re,'____');
  });
  return d;
}
function qPoolList(){
  return GLOSS.filter(g=>{
    if(Q.pool==='pending'&&doneSet.has(g.t))return false;
    if(Q.pool==='prio'&&!prioSet.has(g.t))return false;
    if(Q.cat!=='all'&&g.c!==Q.cat)return false;
    return true;
  });
}
function startQuiz(){
  const pool=qPoolList();if(!pool.length)return;
  const weighted=[];pool.forEach(g=>{const w=prioSet.has(g.t)?3:1;for(let i=0;i<w;i++)weighted.push(g)});
  const picked=[];const seen=new Set();
  shuffle(weighted).forEach(g=>{if(!seen.has(g.t)&&picked.length<Math.min(Q.len,pool.length)){seen.add(g.t);picked.push(g)}});
  const qs=picked.map(g=>{
    const same=shuffle(GLOSS.filter(x=>x.c===g.c&&x.t!==g.t));
    const other=shuffle(GLOSS.filter(x=>x.c!==g.c));
    const ds=[...same,...other].slice(0,3);
    return {g,opts:shuffle([g,...ds])};
  });
  Q.s={qs,i:0,score:0,streak:0,best:0,ans:null,missed:[]};
  renderQuiz();
}
function renderQuiz(){
  const box=$('#quiz'),l=L(),s=Q.s;
  if(!s){
    const n=qPoolList().length;
    const pools=[['pending',l.qPoolPending],['prio','★ '+l.qPoolPrio],['all',l.qPoolAll]];
    box.innerHTML=`<div class="qcard">
      <h2 style="margin:0 0 4px;font-size:20px">${esc(l.qTitle)}</h2>
      <p class="hint" style="margin:0 0 16px">${esc(l.qSub)}</p>
      <div class="row"><span class="lbl">${esc(l.qPool)}</span>${pools.map(([k,nm])=>`<button class="${Q.pool===k?'on':''}" data-qpool="${k}">${esc(nm)}</button>`).join('')}</div>
      <div class="row"><span class="lbl">${esc(l.qCat)}</span><button class="${Q.cat==='all'?'on':''}" data-qcat="all">${esc(l.allF)}</button>${GCATS.map(c=>`<button class="cat-btn ${Q.cat===c?'on':''}" style="--k:${gcColor(c)}" data-qcat="${esc(c)}">${esc(gcName(c))}</button>`).join('')}</div>
      <div class="row"><span class="lbl">${esc(l.qLen)}</span>${[5,10,20].map(k=>`<button class="${Q.len===k?'on':''}" data-qlen="${k}">${k}</button>`).join('')}</div>
      <p class="hint" style="margin:10px 0 14px">${n} ${esc(l.qAvail)}. ${esc(l.qWeight)}</p>
      ${n?'':`<p class="hint">${esc(l.qNoPool)}</p>`}
      <button class="btn primary" data-qact="start" ${n?'':'disabled'}>${esc(l.qStart)}</button>
    </div>`;
    return;
  }
  if(s.i>=s.qs.length){
    const N=s.qs.length,pct=Math.round(s.score/N*100);
    const msg=pct>=80?l.qMsgHi:(pct>=50?l.qMsgMid:l.qMsgLo);
    box.innerHTML=`<div class="qcard">
      <div class="qhead"><b>${esc(l.qDone)}</b><span>${esc(l.qStreak)}: <b>${s.best}</b></span></div>
      <div class="qscore">${s.score} / ${N} <span style="font-size:20px;color:var(--mut)">(${pct}%)</span></div>
      <p>${esc(s.missed.length?msg:l.qPerfect)}</p>
      ${s.missed.length?`<h4 style="margin:16px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)">${esc(l.qMissed)}</h4>
      <ul class="qmiss">${s.missed.map(g=>`<li style="--k:${gcColor(g.c)}"><b>${esc(g.t)}</b>: ${esc(defOf(g))}</li>`).join('')}</ul>`:''}
      <div class="qbtns">
        <button class="btn primary" data-qact="again">${esc(l.qAgain)}</button>
        ${s.missed.length?`<button class="btn" data-qact="prioMissed">★ ${esc(l.qPrioMissed)}</button>`:''}
        <button class="btn" data-qact="settings">${esc(l.qSettings)}</button>
      </div></div>`;
    return;
  }
  const q=s.qs[s.i],g=q.g,N=s.qs.length,ans=s.ans;
  const isP=prioSet.has(g.t),isD=doneSet.has(g.t);
  box.innerHTML=`<div class="qcard">
    <div class="qhead"><span>${esc(l.qQ)} <b>${s.i+1}/${N}</b></span><span>${esc(l.qHits)}: <b>${s.score}</b></span><span>${esc(l.qStreak)}: <b>${s.streak}</b> ${s.streak>=3?'🔥':''}</span><span style="margin-left:auto"><button class="btn" data-qact="settings" style="padding:3px 10px;font-size:12px">${esc(l.qSettings)}</button></span></div>
    <div class="qprog"><i style="width:${(s.i+(ans?1:0))/N*100}%"></i></div>
    <span class="qcat" style="--k:${gcColor(g.c)}">${esc(gcName(g.c))}</span>
    <p class="qdef">${esc(maskDef(g))}</p>
    <div class="qopts">${q.opts.map((o,k)=>{
      let cls='';
      if(ans){if(o.t===g.t)cls='right';else if(o.t===ans)cls='wrong';else cls='faded'}
      return `<button class="qopt ${cls}" style="--k:${gcColor(o.c)}" data-qopt="${esc(o.t)}" ${ans?'disabled':''}><span class="n">${k+1}</span>${esc(o.t)}</button>`;
    }).join('')}</div>
    ${ans?`<div class="qfb ${ans===g.t?'ok':'bad'}">${ans===g.t?'✓ '+esc(l.qRight):'✗ '+esc(l.qWrongIs)+': <b>'+esc(g.t)+'</b>'}</div>
    <div class="qbtns">
      <button class="btn primary" data-qact="next">${esc(s.i+1>=N?l.qFinish:l.qNext)}</button>
      <button class="btn ${isP?'on':''}" data-qact="prio">★ ${esc(isP?l.btnPrioOn:l.btnPrio)}</button>
      <button class="btn ${isD?'on':''}" data-qact="done">✓ ${esc(isD?l.btnDoneOn:l.btnDone)}</button>
    </div>`:''}
    <p class="qkeys">${esc(l.qKeys)}</p></div>`;
}
function qToggle(kind,t){
  if(kind==='prio'){if(prioSet.has(t))prioSet.delete(t);else{prioSet.add(t);doneSet.delete(t)}}
  else{if(doneSet.has(t))doneSet.delete(t);else{doneSet.add(t);prioSet.delete(t)}}
  persist();renderGloss();renderSide();
}
function qAnswer(t){
  const s=Q.s;if(!s||s.ans||s.i>=s.qs.length)return;
  const g=s.qs[s.i].g;s.ans=t;
  if(t===g.t){s.score++;s.streak++;s.best=Math.max(s.best,s.streak)}else{s.streak=0;s.missed.push(g)}
  renderQuiz();
}
function qNext(){const s=Q.s;if(!s||!s.ans)return;s.i++;s.ans=null;renderQuiz()}
$('#quiz').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.qpool){Q.pool=d.qpool;renderQuiz()}
  else if(d.qcat){Q.cat=d.qcat;renderQuiz()}
  else if(d.qlen){Q.len=+d.qlen;renderQuiz()}
  else if(d.qopt!==undefined)qAnswer(d.qopt);
  else if(d.qact==='start'||d.qact==='again')startQuiz();
  else if(d.qact==='settings'){Q.s=null;renderQuiz()}
  else if(d.qact==='next')qNext();
  else if(d.qact==='prio'||d.qact==='done'){qToggle(d.qact,Q.s.qs[Q.s.i].g.t);renderQuiz()}
  else if(d.qact==='prioMissed'){Q.s.missed.forEach(g=>{prioSet.add(g.t);doneSet.delete(g.t)});persist();renderGloss();renderSide();b.disabled=true;b.textContent='★ ✓'}
});
document.addEventListener('keydown',e=>{
  if(!$('#v-quiz').classList.contains('on')||!Q.s)return;
  if(e.target.tagName==='INPUT')return;
  const s=Q.s;
  if(s.i<s.qs.length&&!s.ans&&/^[1-4]$/.test(e.key)){const o=s.qs[s.i].opts[+e.key-1];if(o){e.preventDefault();qAnswer(o.t)}}
  else if((e.key==='Enter'||e.key===' ')&&s.ans&&s.i<s.qs.length){e.preventDefault();qNext()}
});

/* ---------- Tabs and language ---------- */
function show(v){
  ['map','gl','quiz'].forEach(k=>{
    $('#v-'+k).classList.toggle('on',v===k);$('#b-'+k).classList.toggle('on',v===k);
  });
  if(v==='quiz')renderQuiz();
}
$('#b-map').addEventListener('click',()=>show('map'));
$('#b-gl').addEventListener('click',()=>show('gl'));
$('#b-quiz').addEventListener('click',()=>show('quiz'));

function applyLang(){
  document.documentElement.lang=ST.lang;
  $('#t-h1').textContent=L().h1;$('#t-sub').textContent=L().sub;
  $('#b-map').textContent=L().tabMap;$('#b-gl').textContent=L().tabGl;$('#b-quiz').textContent=L().tabQuiz;
  $('#q').placeholder=L().search;$('#note').textContent=L().note;
  document.title=L().h1;
  $('#l-es').classList.toggle('on',ST.lang==='es');$('#l-en').classList.toggle('on',ST.lang==='en');
  buildMap();renderSide();renderFilters();renderGloss();renderQuiz();
}
function setLang(l){ST.lang=l;persist();applyLang()}
$('#l-es').addEventListener('click',()=>setLang('es'));
$('#l-en').addEventListener('click',()=>setLang('en'));

applyLang();
</script>
